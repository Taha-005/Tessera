# CI: runs on every pull request to main and every push to main. Needs no secrets.
# The two job names, `backend` and `frontend`, are the required checks for branch protection (TESS-10).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values for CI only; nothing here is a real secret.
      DATABASE_URL: sqlite:///${{ github.workspace }}/ci.db
      DATA_DIR: ${{ github.workspace }}/data/synthetic
      JWT_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Tests
        run: uv run pytest -v

      - name: Migrations on a fresh database
        run: uv run alembic upgrade head

      - name: Files under data/raw are still git-ignored
        working-directory: .
        run: |
          mkdir -p data/raw
          touch data/raw/ci-probe.csv
          git check-ignore -v data/raw/ci-probe.csv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
